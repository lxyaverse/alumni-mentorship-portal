services:
  - type: web
    name: alumni-mentorship-portal
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: portal-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: PORT
        value: 3000
      - key: DEMO
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: DB_FILE
        value: /app/data/portal.db
